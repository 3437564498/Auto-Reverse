[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-reverse"
version = "0.1.0"
description = "Pure-static Android ARM64 recovery research foundation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "capstone==5.0.9",
  "pyelftools==0.32",
  "z3-solver==4.15.4.0",
  "pydantic==2.12.3",
  "mcp==1.29.0",
  "PyYAML==6.0.3",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.14.0"]

[project.scripts]
arm64-recover = "auto_reverse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
