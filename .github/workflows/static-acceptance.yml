name: Pinned static acceptance matrix

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'toolchains/**'
      - 'schemas/**'
      - '.github/workflows/static-acceptance.yml'

permissions:
  contents: read

jobs:
  static-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python tooling
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
          python -m pip install cmake==3.31.6
      - name: Download and verify fixed compiler and static-analysis archives
        run: python scripts/install_static_toolchains.py --output work/tools --tools ndk ghidra jdk
      - name: Compile and statically classify the complete frozen micro-matrix
        env:
          JAVA_HOME: ${{ github.workspace }}/work/tools/jdk-21.0.8+9
        run: >-
          python scripts/run_static_acceptance.py
          --ndk-root work/tools/android-ndk-r27c
          --ghidra-home work/tools/ghidra_11.3.2_PUBLIC
          --output work/static-acceptance
      - name: Consume actual evidence delivery and freeze original debug declarations
        run: >-
          python scripts/run_evidence_contract_sample.py
          --ndk-root work/tools/android-ndk-r27c
          --output work/evidence-contract-acceptance
      - name: Register and revoke a host A0 memory assumption without enabling proof consumption
        run: >-
          python scripts/run_memory_context_sample.py
          --ndk-root work/tools/android-ndk-r27c
          --output work/memory-context-acceptance
      - name: Recover a partial project, rebuild its source archive and prove new linked bytes
        run: >-
          python scripts/run_project_pipeline_sample.py
          --ndk-root work/tools/android-ndk-r27c
          --output work/project-pipeline-acceptance
      - name: Compare candidate structure declarations with original DWARF using fixed Clang
        run: >-
          python scripts/run_candidate_layout_sample.py
          --ndk-root work/tools/android-ndk-r27c
          --output work/candidate-layout-acceptance
      - name: Freeze original layout declarations through a real leased offline delivery
        run: >-
          python scripts/run_layout_contract_sample.py
          --ndk-root work/tools/android-ndk-r27c
          --output work/layout-contract-acceptance
      - name: Compile actual layout-guarded candidates and project, rebuild archive and prove new bytes
        run: >-
          python scripts/run_layout_dependency_sample.py
          --ndk-root work/tools/android-ndk-r27c
          --output work/layout-dependency-acceptance
      # Owned CFG source must survive actual guards and fresh archive builds.
      - name: Recover conditional sources through actual layout-guarded TUs and archive reconstruction
        run: >-
          python scripts/run_layout_dependency_sample.py --conditional
          --ndk-root work/tools/android-ndk-r27c
          --output work/acyclic-recovery-acceptance
      - name: Recover logical flags through guarded TUs, rebuild archive and prove new linked bytes
        run: >-
          python scripts/run_layout_dependency_sample.py --logical-flags
          --ndk-root work/tools/android-ndk-r27c
          --output work/logical-source-acceptance
      - name: Recover variable shifts through guarded TUs and prove fresh archive-linked bytes
        run: >-
          python scripts/run_layout_dependency_sample.py --variable-shifts
          --ndk-root work/tools/android-ndk-r27c
          --output work/variable-source-acceptance
      - name: Test durable tool activities, current authority and failure windows with real tools
        env:
          AUTO_REVERSE_TEST_NDK_ROOT: ${{ github.workspace }}/work/tools/android-ndk-r27c
          GHIDRA_HOME: ${{ github.workspace }}/work/tools/ghidra_11.3.2_PUBLIC
          JAVA_HOME: ${{ github.workspace }}/work/tools/jdk-21.0.8+9
          AUTO_REVERSE_BYTE_HELPER_REPORT: ${{ github.workspace }}/work/byte-helper-acceptance/byte-helper-acceptance.json
        run: |
          AUTO_REVERSE_TEST_CMAKE="$(command -v cmake)"
          test -x "$AUTO_REVERSE_TEST_CMAKE"
          export AUTO_REVERSE_TEST_CMAKE
          pytest -q
      - name: Upload static evidence even on classification failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pinned-static-acceptance-${{ github.sha }}
          path: |
            work/static-acceptance/
            work/evidence-contract-acceptance/evidence-contract-sample.json
            work/memory-context-acceptance/memory-context-sample.json
            work/project-pipeline-acceptance/project-pipeline-sample.json
            work/project-pipeline-acceptance/recovered/project.zip
            work/candidate-layout-acceptance/candidate-layout-sample.json
            work/layout-contract-acceptance/layout-contract-sample.json
            work/layout-dependency-acceptance/layout-dependency-sample.json
            work/layout-dependency-acceptance/project.zip
            work/acyclic-recovery-acceptance/layout-dependency-sample.json
            work/acyclic-recovery-acceptance/project.zip
            work/logical-source-acceptance/layout-dependency-sample.json
            work/logical-source-acceptance/project.zip
            work/variable-source-acceptance/layout-dependency-sample.json
            work/variable-source-acceptance/project.zip
            work/byte-helper-acceptance/byte-helper-acceptance.json
          if-no-files-found: warn
