name: Static foundation checks

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install -e . --no-deps
      - run: ruff check src tests scripts
      - run: pytest -q
      - name: Shared schemas match Python contracts
        run: |
          python -c "from auto_reverse.contracts import write_schemas; write_schemas('schemas')"
          git diff --exit-code -- schemas
  dsh-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: integrations/dsh/package-lock.json
      - run: npm ci
        working-directory: integrations/dsh
      - run: npm test
        working-directory: integrations/dsh
